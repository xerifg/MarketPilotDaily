name: Daily market report
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test sends one test report; daily respects the email pause setting'
        type: choice
        options: [test, daily]
        default: test
      version:
        description: 'Explicit test version; daily always uses version 1'
        type: choice
        options: ['1', '2', '3']
        default: '1'
permissions:
  contents: read
concurrency:
  group: market-pilot-daily
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install time zone data
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Generate and send report
        env:
          REPORT_MODE: ${{ github.event.inputs.mode || 'daily' }}
          REPORT_VERSION: ${{ github.event.inputs.version || '1' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m jobs.daily
